name: SEO GEO verification

on:
  push:
    branches:
      - main
      - feat/seo-geo-hardening
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SEO and GEO contract
        run: npm run seo:check

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build production app
        run: npm run build
