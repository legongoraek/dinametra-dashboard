<div class="chart-wrapper">
  <canvas
    baseChart
    [type]="lineChartType"
    [data]="lineChartData"
    [options]="lineChartOptions"
    aria-label="Gráfico de línea con histórico de precio"
    role="img"
  ></canvas>
</div>

<p class="sr-only">
  El gráfico muestra la evolución histórica del precio de la criptomoneda
  seleccionada en el rango de tiempo configurado.
</p>
