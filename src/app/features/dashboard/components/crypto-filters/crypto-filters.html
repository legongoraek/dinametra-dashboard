<form class="filters-form" aria-label="Filtros del dashboard">
  <div class="filter-field">
    <label for="coin">Criptomoneda</label>

    <p-select
      inputId="coin"
      ariaLabel="Selecciona una criptomoneda para filtrar el dashboard"
      [options]="cryptoOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.coinId"
      name="coinId"
      placeholder="Selecciona una moneda"
      class="w-full"
      (onChange)="emitFilters()"
    />
  </div>

  <div class="filter-field">
    <label for="currency">Divisa</label>

    <p-select
      inputId="currency"
      ariaLabel="Selecciona una divisa para filtrar el dashboard"
      [options]="currencyOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.currency"
      name="currency"
      placeholder="Selecciona una divisa"
      class="w-full"
      (onChange)="emitFilters()"
    />
  </div>

  <div class="filter-field">
    <label for="days">Rango de tiempo</label>

    <p-select
      inputId="days"
      ariaLabel="Selecciona un rango de tiempo para filtrar el dashboard"
      [options]="daysOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.days"
      name="days"
      placeholder="Selecciona un rango"
      class="w-full"
      (onChange)="emitFilters()"
    />
  </div>

  <div class="filter-field">
    <label for="sortBy">Ordenar por</label>

    <p-select
      inputId="sortBy"
      ariaLabel="Selecciona un criterio de orden para filtrar el dashboard"
      [options]="sortOptions"
      optionLabel="label"
      optionValue="value"
      [(ngModel)]="filters.sortBy"
      name="sortBy"
      placeholder="Selecciona un orden"
      class="w-full"
      (onChange)="emitFilters()"
    />
  </div>

  <div class="filter-actions">
    <p-button
      type="button"
      label="Restablecer"
      icon="pi pi-refresh"
      severity="primary"
      outlined="true"
      ariaLabel="Restablecer filtros del dashboard"
      (onClick)="resetFilters()"
    />
  </div>
</form>
