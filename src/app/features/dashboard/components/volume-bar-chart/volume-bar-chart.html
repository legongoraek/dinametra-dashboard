<div class="chart-wrapper">
  <canvas
    baseChart
    [type]="barChartType"
    [data]="barChartData"
    [options]="barChartOptions"
    aria-label="Gráfico de barras con comparación de volumen de criptomonedas"
    role="img"
  ></canvas>
</div>

<p class="sr-only">
  El gráfico compara el volumen de las principales criptomonedas cargadas
  desde la API de CoinGecko.
</p>
